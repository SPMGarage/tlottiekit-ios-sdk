# Run ../build.sh first, then generate the Xcode project with: xcodegen generate
name: TLottieDemo
options:
  bundleIdPrefix: com.example.tlottie
packages:
  TLottieKit:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TLottieKit
    PRODUCT_NAME: TLottieDemo
targets:
  TLottieDemo-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources, Resources]
    dependencies:
      - package: TLottieKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tlottie.demo
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Drop .tgs files into the app's Documents folder from the Files app or Finder.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  TLottieDemo-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [Sources, Resources]
    dependencies:
      - package: TLottieKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tlottie.demo.mac
        CODE_SIGN_IDENTITY: "-"
